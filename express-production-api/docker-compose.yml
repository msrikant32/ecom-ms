services:
  app:
    build: .
    container_name: express-api-app
    ports:
      - "3000:3000"
    environment:
      # The Dockerfile itself defaults to NODE_ENV=production (the correct,
      # safe default for the image on its own) - overridden here because
      # this compose stack's whole purpose is a local/demo full-stack run,
      # and server.js only seeds the demo admin user + sample products when
      # NODE_ENV !== 'production'. Without this override, `docker compose up`
      # would boot to an empty database with no login and no products -
      # override to NODE_ENV=production explicitly if you want to verify
      # the actual no-seed production boot behavior instead.
      - NODE_ENV=${NODE_ENV:-development}
      # Service-name networking: "mongo"/"redis" resolve via Docker's
      # internal DNS to the containers below - not localhost, which
      # wouldn't reach anything from inside this container's own network
      # namespace. See the docker-compose-fundamentals interview question.
      - MONGODB_URI=mongodb://mongo:27017/express-production-api
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      # Dev-only fallback secrets so `docker compose up` works out of the
      # box - override every one of these with a real secrets manager
      # value before this ever runs anywhere but a local machine.
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev_access_secret_do_not_use_in_prod}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret_do_not_use_in_prod}
      - CSRF_SECRET=${CSRF_SECRET:-dev_csrf_secret_do_not_use_in_prod}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    container_name: express-api-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: express-api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  redis-data:
